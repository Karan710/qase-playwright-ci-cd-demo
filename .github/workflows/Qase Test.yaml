name: Qase Tests
on:
  workflow_dispatch:
    inputs:
      qase_api_base_url:
        description: 'Qase API URL'
        required: true
      qase_report:
        description: 'Enabled/disabled reporting to Qase'
        required: true
      qase_project_code:
        description: 'Qase project code'
        required: true
      qase_run_id:
        description: 'Qase Run ID'
        required: true
      qase_run_complete:
        description: 'Qase Run autocomplete'
        required: true

env:
  QASE_API_BASE_URL: ${{ inputs.qase_api_base_url }}
  QASE_TESTOPS_PROJECT: ${{ inputs.EMT2 }}
  QASE_TESTOPS_RUN_ID: ${{ inputs.qase_run_id }}
  QASE_TESTOPS_RUN_COMPLETE: true
  QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_MCTESTS_API_TOKEN_EVAL }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: cskmnrpt/qase-link-run@v2
        env:
          QASE_TESTOPS_API_TOKEN: ${{ env.QASE_TESTOPS_API_TOKEN }}
      - name: Run Full Suite
        uses: ./.github/workflows/ci_e2e.yaml
        if: ${{ inputs.suite == 'all' }}
      - name: Run Smoke Suite
        uses: ./.github/workflows/ci_smoke.yaml
        if: ${{ inputs.suite == 'smoke' }}
        #If going forward with Qase, write new workflow for
        #runs that specify the environment and suite explicitly
      - name: Run Full Suite in Dev Environment
        uses: ./.github/workflows/ci_e2e.yaml
        if: ${{ inputs.suite == 'all' && inputs.env == 'dev' }}
